name: PR tests
on:
  pull_request:
    branches:
      - main
    tags:
      - "*"
  push:
    branches:
      - main
    tags:
      - "*"

env:
  CONDA: /local/tmp/kbmod-runner/miniconda3
  PYTHONNOUSERSITE: "1"
  PYTHONPATH: ""

jobs:
  test-fiducial:
    name:  Testing in kbmod_ci env.
    runs-on: self-hosted
    env:
      KBMOD_CI_ENV: kbmod-test-${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      fail-fast: true
    defaults:
      run:
        shell: bash -leo pipefail {0}
    steps:
      - name: Setup environment
        shell: bash --noprofile --norc -eo pipefail {0}
        run: echo "/usr/local/cuda-12/bin" > $GITHUB_PATH
      - name: Setup miniconda
        uses: conda-incubator/setup-miniconda@v2.2.0
        with:
          activate-environment: ${{ env.KBMOD_CI_ENV }}
          python-version: "3.13"
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive
        # Run linters before attempting to compile and install
        # the package, faster fails.
      - name: Linter
        uses: psf/black@stable
        with:
          jupyter: true
      - name: Build KBMOD
        run: |
          python -m pip install .
      - name: Run tests
        run: |
          cd tests
          python -m unittest -b
          cd ..
      - name: Remove run environment
        if: ${{ always() }}
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          if [ -d "$CONDA/envs/$KBMOD_CI_ENV/conda-meta" ]; then
            "$CONDA/bin/conda" env remove --yes --name "$KBMOD_CI_ENV"
          fi
